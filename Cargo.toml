[package]
name = "ctxlane"
version = "0.2.0"
default-run = "ctxlane"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Switch between Claude Code and Codex accounts with isolated local state"
repository = "https://github.com/mikigraf/ctxlane"
readme = "README.md"
keywords = ["claude", "codex", "cli", "credentials", "accounts"]
categories = ["command-line-utilities", "authentication"]

[features]
test-fixtures = []

[[bin]]
name = "ctxlane-test-vendor"
path = "tests/fixtures/native_vendor.rs"
required-features = ["test-fixtures"]
test = false
bench = false
doc = false

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
directories = "6.0.0"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = "0.25.13"
which = "8.0.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
signal-hook = "0.4.4"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
too_many_lines = "allow"
