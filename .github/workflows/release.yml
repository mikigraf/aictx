name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.97.1

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build and package host artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "tag version ${version} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi
          package="package/aictx-${version}-${target}"
          mkdir -p "$package/completions" dist

          cargo build --release --locked --target "$target"

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp "target/${target}/release/aictx.exe" "$package/aictx.exe"
            binary="$package/aictx.exe"
          else
            cp "target/${target}/release/aictx" "$package/aictx"
            binary="$package/aictx"
          fi

          cp README.md LICENSE SECURITY.md THREAT_MODEL.md CONTRIBUTING.md CHANGELOG.md "$package/"
          cp -R docs "$package/docs"
          "$binary" completions bash > "$package/completions/aictx.bash"
          "$binary" completions zsh > "$package/completions/_aictx"
          "$binary" completions fish > "$package/completions/aictx.fish"
          "$binary" completions powershell > "$package/completions/_aictx.ps1"
          "$binary" completions elvish > "$package/completions/aictx.elv"

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            archive="dist/aictx-${version}-${target}.zip"
            # Keep the same single top-level package directory used by the
            # Unix tarballs. Omitting the wildcard avoids scattering files
            # into the extraction directory on Windows.
            powershell -NoProfile -Command "Compress-Archive -Path '${package}' -DestinationPath '${archive}'"
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            archive="dist/aictx-${version}-${target}.tar.gz"
            tar -C "$(dirname "$package")" -czf "$archive" "$(basename "$package")"
            if [[ "${RUNNER_OS}" == "macOS" ]]; then
              (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
            else
              (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
            fi
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aictx-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate CycloneDX SBOM with pinned Syft 1.42.3
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft_1.42.3_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/syft-1.42.3"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz
          echo "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509  ${archive}" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" syft
          "$install_dir/syft" scan dir:. \
            -o "cyclonedx-json=dist/aictx-${GITHUB_REF_NAME}-source.cdx.json"

      - name: Checksum SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom="aictx-${GITHUB_REF_NAME}-source.cdx.json"
          (cd dist && sha256sum "$sbom" > "${sbom}.sha256")

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign release artifacts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done < <(find dist -maxdepth 1 -type f ! -name '*.sigstore.json' -print0)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Publish release and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
